name: noteout
description: "Minimalistic markdown note-taking with LaTeX and GitHub sync"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_markdown: ^0.7.6
  markdown: ^7.3.1
  flutter_math_fork: ^0.7.3
  hive_ce: ^2.9.0
  hive_ce_flutter: ^2.3.4
  uuid: ^4.5.1
  intl: ^0.19.0
  http: ^1.2.2
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  crypto: ^3.0.3
  docs_gee: ^1.5.0
  image_picker: ^1.2.3
  file_picker: ^10.3.10
  flutter_image_compress: ^2.5.1
  flutter_svg: ^2.3.0
  emojis: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/logo.svg
    - assets/site/deploy.yml
    - assets/site/build-site.py

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#0E0E12"
  image: "assets/logo.png"
  image_dark: "assets/logo.png"
  android_12:
    color: "#FFFFFF"
    color_dark: "#0E0E12"
    image: "assets/logo.png"
    image_dark: "assets/logo.png"
