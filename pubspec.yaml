name: noteout
description: "Minimalistic markdown note-taking with LaTeX and GitHub sync"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_markdown: ^0.7.6
  markdown: ^7.3.1
  flutter_math_fork: ^0.7.3
  hive_ce: ^2.9.0
  hive_ce_flutter: ^2.3.4
  uuid: ^4.5.1
  intl: ^0.19.0
  http: ^1.2.2
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  crypto: ^3.0.3
  docs_gee: ^1.5.0
  image_picker: ^1.2.3
  file_picker: ^11.0.3
  flutter_image_compress: ^2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/site/deploy.yml
    - assets/site/build-site.py
